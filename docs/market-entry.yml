description:
  en: Sidebar todo list for DeepSeek Harness — grouped buckets, recurring tasks with a month-view calendar, hover-to-act sticky notes (convert to todo), header filters, and agent tools that read and write the same JSON file. Requires DSH 0.2.1-rc.2+.
